# Images are pinned to tested versions so a restart never pulls a surprise update. To update one:
# change its tag here, run box/setup.sh, check the dashboard, then commit. (Versions as of 2026-11-26.)
# Every container keeps at most 3 x 10 MB of logs, so logs can't slowly fill the disk.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  # Up/down + latency dashboard with alerts (http://<host>:3001)
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12
    container_name: uptime-kuma
    restart: unless-stopped
    logging: *logging
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets monitors check the other tools on this box
    volumes:
      - ./uptime-kuma:/app/data:z

  # Finds every device on the LAN, flags new/unknown ones (http://<host>:20211)
  netalertx:
    image: ghcr.io/jokob-sk/netalertx:26.10.28
    container_name: netalertx
    restart: unless-stopped
    logging: *logging
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    environment:
      - TZ=${TZ:-UTC}
      - PORT=20211
    volumes:
      - ./netalertx:/data:z

  # Scheduled internet speed tests with history graphs (http://<host>:8765)
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:v1.15.1-ls183
    container_name: speedtest-tracker
    restart: unless-stopped
    logging: *logging
    ports:
      - "8765:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - APP_URL=http://localhost:8765
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 */4 * * *
      - DISPLAY_TIMEZONE=${TZ:-UTC}
    volumes:
      - ./speedtest-tracker:/config:z

  # lanpulse collector: reads the Uptime Kuma status page, writes data/snapshot.json,
  # and optionally pushes it to cloud publishers (see lanpulse.env.example)
  lanpulse-collector:
    image: python:3.12.16-alpine3.24
    container_name: lanpulse-collector
    restart: unless-stopped
    logging: *logging
    command: ["python", "-u", "/app/collector.py"]
    env_file: [lanpulse.env]
    environment:
      - KUMA_URL=http://uptime-kuma:3001
      - PUBLISH_FILE_DIR=/data
      - TZ=${TZ:-UTC}
    volumes:
      - ./collector:/app:ro,z
      - ./data:/data:z
      - ./uptime-kuma:/kuma:ro,z      # read-only: maps monitors to IPs for router link info
      - ./config:/config:z            # settings saved from the dashboard (router login); never served
    depends_on: [uptime-kuma]

  # lanpulse dashboard: the web app plus live data (http://<host>:8080)
  lanpulse-web:
    image: caddy:2.11.9-alpine
    container_name: lanpulse-web
    restart: unless-stopped
    logging: *logging
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./web:/srv/www:ro,z
      - ./data:/srv/data:ro,z
